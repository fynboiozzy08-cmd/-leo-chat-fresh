<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Leo Chat"
  >

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./logo.svg">
  <link rel="icon" href="./logo.svg">

  <link
    rel="stylesheet"
    href="./styles.css?v=9"
  >

  <title>Leo Chat</title>
</head>

<body>

  <div id="app">

    <main class="screen center">

      <div class="brand">🦁</div>

      <h1>Leo Chat</h1>

      <p class="tagline">
        Chat. Connect. Roar.
      </p>

      <p id="status" class="muted">
        Starting Leo Chat...
      </p>

    </main>

  </div>

  <script>

    /*
     * Catch JavaScript errors BEFORE app.js loads.
     */

    window.addEventListener("error", function(event) {

      var app =
        document.getElementById("app");

      if (!app) return;

      var message =
        event.message ||
        "Unknown JavaScript error.";

      app.innerHTML = `

        <main class="screen center">

          <div class="brand">
            🦁
          </div>

          <h1>
            Leo Chat
          </h1>

          <p class="tagline">
            Chat. Connect. Roar.
          </p>

          <div class="card error-card">

            <h2>
              JavaScript Error
            </h2>

            <p>
              ${message}
            </p>

            <p>
              Line:
              ${event.lineno || "unknown"}
            </p>

            <p>
              File:
              ${event.filename || "unknown"}
            </p>

          </div>

        </main>

      `;

    });

    window.addEventListener(
      "unhandledrejection",
      function(event) {

        var app =
          document.getElementById("app");

        if (!app) return;

        var reason =
          event.reason?.message ||
          String(
            event.reason ||
            "Unknown promise error."
          );

        app.innerHTML = `

          <main class="screen center">

            <div class="brand">
              🦁
            </div>

            <h1>
              Leo Chat
            </h1>

            <p class="tagline">
              Chat. Connect. Roar.
            </p>

            <div class="card error-card">

              <h2>
                Startup Error
              </h2>

              <p>
                ${reason}
              </p>

            </div>

          </main>

        `;

      }
    );

  </script>


  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    crossorigin="anonymous"
  ></script>


  <!-- =====================================================
       CONFIG
       ===================================================== -->

  <script
    src="./config.js?v=9"
  ></script>


  <!-- =====================================================
       LEO CHAT
       ===================================================== -->

  <script
    src="./app.js?v=9"
  ></script>


  <!-- =====================================================
       LOADER STATUS
       ===================================================== -->

  <script>

    setTimeout(function() {

      var app =
        document.getElementById("app");

      /*
       * If boot() never replaced the loader,
       * show a useful diagnostic.
       */

      if (
        app &&
        app.innerText.includes(
          "Starting Leo Chat"
        )
      ) {

        app.innerHTML = `

          <main class="screen center">

            <div class="brand">
              🦁
            </div>

            <h1>
              Leo Chat
            </h1>

            <p class="tagline">
              Chat. Connect. Roar.
            </p>

            <div class="card error-card">

              <h2>
                Leo Chat stopped starting
              </h2>

              <p>
                The app.js file loaded, but Leo Chat did not start.
              </p>

              <p>
                This usually means an error occurred while executing app.js.
              </p>

            </div>

          </main>

        `;

      }

    }, 5000);

  </script>

</body>
</html>
