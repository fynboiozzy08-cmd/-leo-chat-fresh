<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Leo Chat"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./logo.svg"
  >

  <link
    rel="icon"
    href="./logo.svg"
  >

  <link
    rel="stylesheet"
    href="./styles.css?v=5"
  >

  <title>Leo Chat</title>
</head>

<body>

  <div id="app">
    <main class="screen center">
      <div class="brand">🦁</div>

      <h1>Leo Chat</h1>

      <p class="tagline">
        Chat. Connect. Roar.
      </p>

      <p class="muted">
        Starting Leo Chat...
      </p>
    </main>
  </div>

  <!-- SUPABASE -->
  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    onload="window.LEO_SUPABASE_LOADED=true"
    onerror="document.getElementById('app').innerHTML='<main class=&quot;screen center&quot;><h1>🦁 Leo Chat</h1><p>Supabase library failed to load.</p></main>'">
  </script>

  <!-- CONFIG -->
  <script
    src="./config.js?v=5"
    onload="window.LEO_CONFIG_LOADED=true"
    onerror="document.getElementById('app').innerHTML='<main class=&quot;screen center&quot;><h1>🦁 Leo Chat</h1><p>config.js failed to load.</p></main>'">
  </script>

  <!-- APP -->
  <script
    src="./app.js?v=5"
    onload="window.LEO_APP_LOADED=true"
    onerror="document.getElementById('app').innerHTML='<main class=&quot;screen center&quot;><h1>🦁 Leo Chat</h1><p>app.js failed to load.</p></main>'">
  </script>

  <!-- STARTUP DIAGNOSTIC -->
  <script>
    setTimeout(function () {
      if (window.LEO_APP_LOADED) {
        return;
      }

      document.getElementById("app").innerHTML = `
        <main class="screen center">
          <div class="brand">🦁</div>
          <h1>Leo Chat</h1>
          <div class="card error-card">
            <h2>Leo Chat startup stopped</h2>
            <p>App.js did not finish loading.</p>
            <p>Supabase loaded: ${window.LEO_SUPABASE_LOADED ? "YES" : "NO"}</p>
            <p>Config loaded: ${window.LEO_CONFIG_LOADED ? "YES" : "NO"}</p>
            <p>App loaded: ${window.LEO_APP_LOADED ? "YES" : "NO"}</p>
          </div>
        </main>
      `;
    }, 5000);
  </script>

</body>
</html>
