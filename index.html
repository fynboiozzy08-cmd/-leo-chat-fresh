<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#050505"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Leo Chat"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <link
    rel="apple-touch-icon"
    href="./logo.svg"
  >

  <link
    rel="icon"
    href="./logo.svg"
  >

  <link
    rel="stylesheet"
    href="./styles.css?v=7"
  >

  <title>Leo Chat</title>
</head>

<body>

  <div id="app">
    <main class="screen center">

      <div class="brand">
        🦁
      </div>

      <h1>
        Leo Chat
      </h1>

      <p class="tagline">
        Chat. Connect. Roar.
      </p>

      <p class="muted">
        Starting Leo Chat...
      </p>

    </main>
  </div>

  <!-- =====================================================
       SUPABASE
       ===================================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    crossorigin="anonymous"
    onload="window.LEO_SUPABASE_LOADED = true"
    onerror="window.LEO_SUPABASE_FAILED = true"
  ></script>

  <!-- =====================================================
       LEO CONFIG
       ===================================================== -->

  <script
    src="./config.js?v=7"
    onload="window.LEO_CONFIG_LOADED = true"
    onerror="window.LEO_CONFIG_FAILED = true"
  ></script>

  <!-- =====================================================
       LEO APPLICATION
       ===================================================== -->

  <script
    src="./app.js?v=7"
    onload="window.LEO_APP_LOADED = true"
    onerror="window.LEO_APP_FAILED = true"
  ></script>

  <!-- =====================================================
       STARTUP DIAGNOSTIC
       ===================================================== -->

  <script>
    setTimeout(function () {

      if (window.LEO_APP_LOADED) {
        return;
      }

      var app = document.getElementById("app");

      if (!app) {
        return;
      }

      var supabaseStatus =
        window.LEO_SUPABASE_LOADED
          ? "YES"
          : "NO";

      var configStatus =
        window.LEO_CONFIG_LOADED
          ? "YES"
          : "NO";

      var appStatus =
        window.LEO_APP_LOADED
          ? "YES"
          : "NO";

      var message =
        "Supabase library loaded: " +
        supabaseStatus +
        "\\n\\n" +
        "Config loaded: " +
        configStatus +
        "\\n\\n" +
        "App loaded: " +
        appStatus;

      app.innerHTML = `
        <main class="screen center">

          <div class="brand">
            🦁
          </div>

          <h1>
            Leo Chat
          </h1>

          <p class="tagline">
            Chat. Connect. Roar.
          </p>

          <div class="card error-card">

            <h2>
              Leo Chat startup stopped
            </h2>

            <p style="white-space: pre-line;">
              ${message}
            </p>

            <button
              class="outline"
              onclick="location.reload()"
            >
              Reload Leo Chat
            </button>

          </div>

        </main>
      `;

    }, 5000);
  </script>

</body>
</html>
