<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#050505">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Leo Chat"
  >

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./logo.svg">
  <link rel="icon" href="./logo.svg">

  <link
    rel="stylesheet"
    href="./styles.css?v=8"
  >

  <title>Leo Chat</title>
</head>

<body>

  <div id="app">
    <main class="screen center">

      <div class="brand">🦁</div>

      <h1>Leo Chat</h1>

      <p class="tagline">
        Chat. Connect. Roar.
      </p>

      <p id="status" class="muted">
        Starting Leo Chat...
      </p>

    </main>
  </div>

  <script>
    (function () {

      var app = document.getElementById("app");
      var status = document.getElementById("status");

      function setStatus(text) {
        if (status) {
          status.textContent = text;
        }
      }

      function showError(title, details) {

        app.innerHTML = `
          <main class="screen center">

            <div class="brand">🦁</div>

            <h1>Leo Chat</h1>

            <p class="tagline">
              Chat. Connect. Roar.
            </p>

            <div class="card error-card">

              <h2>${title}</h2>

              <p>${details}</p>

              <button
                class="outline"
                onclick="location.reload()"
              >
                Reload Leo Chat
              </button>

            </div>

          </main>
        `;
      }

      function loadScript(src, name) {

        return new Promise(function(resolve, reject) {

          setStatus("Loading " + name + "...");

          var script =
            document.createElement("script");

          script.src = src;

          script.onload = function() {
            resolve();
          };

          script.onerror = function() {
            reject(
              new Error(
                name + " failed to load."
              )
            );
          };

          document.body.appendChild(script);

        });

      }

      async function start() {

        try {

          /*
           * STEP 1
           * Load Supabase first.
           */

          await loadScript(
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
            "Supabase"
          );

          if (
            !window.supabase ||
            typeof window.supabase.createClient !== "function"
          ) {
            throw new Error(
              "Supabase loaded, but createClient was not found."
            );
          }

          /*
           * STEP 2
           * Load Leo configuration.
           */

          await loadScript(
            "./config.js?v=8",
            "Leo configuration"
          );

          if (
            !window.LEO_CONFIG ||
            !window.LEO_CONFIG.SUPABASE_URL ||
            !window.LEO_CONFIG.SUPABASE_KEY
          ) {
            throw new Error(
              "Leo configuration was loaded, but the Supabase settings were not found."
            );
          }

          /*
           * STEP 3
           * Load the actual Leo Chat application.
           */

          await loadScript(
            "./app.js?v=8",
            "Leo Chat application"
          );

          /*
           * If app.js loaded successfully,
           * its boot() function should take over.
           */

          setStatus("Leo Chat loaded.");

        } catch (error) {

          console.error(
            "Leo Chat loader error:",
            error
          );

          showError(
            "Leo Chat could not start",
            error.message ||
              "A startup file failed to load."
          );

        }

      }

      start();

    })();
  </script>

</body>
</html>
